name: CodSpeed

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    paths:
      - src/**
      - tests/prof/**
      - benchmarks/**
      - pyproject.toml
      - uv.lock
      - MANIFEST.in
      - setup.py
      - .pytest.toml
      - .github/workflows/codspeed.yml
  workflow_dispatch:

permissions: {}

env:
  UV_NO_EDITABLE: "true"
  # cisable glibc CPU-feature detection (AVX2) so benchmarks use the same
  # memory routines regardless of which CPU the runner lands on, reducing
  # cross-run variance. See:
  # https://codspeed.io/blog/why-glibc-faster-github-actions#how-to-fix-it-
  GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX512F,-AVX512DQ,-AVX512_VBMI2,-AVX2,-AVX,-ERMS,-FSRM"
  RANDOMLY_SEED: "3485796098"

jobs:
  perf_benchmarks:
    name: performance benchmarks
    runs-on: ubuntu-24.04-arm
    # runs-on: codspeed-macro
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      with:
        persist-credentials: false

    - name: Install Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version-file: pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      with:
        enable-cache: false

    - name: Build msgspec and install profiling dependencies
      run: uv sync --group test-prof

    - name: Install valgrind-codspeed
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential automake autoconf cmake libc6-dev
        git clone --recurse-submodules https://github.com/CodSpeedHQ/valgrind-codspeed
        cd valgrind-codspeed
        git checkout codex/stack-fix
        git submodule update --init --recursive

        # Build the static Capstone that Callgrind cycle estimation links
        # against (x86+arm64 only, hardening-free), and point configure at it.
        CS_SRC="$PWD/third_party/capstone"
        export CAPSTONE_DIR="$PWD/.capstone"
        cmake -S "$CS_SRC" -B "$CS_SRC/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF \
          -DCAPSTONE_X86_SUPPORT=ON \
          -DCAPSTONE_ARM64_SUPPORT=ON \
          -DCAPSTONE_BUILD_SHARED_LIBS=OFF \
          -DCAPSTONE_BUILD_CSTOOL=OFF \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_PREFIX="$CAPSTONE_DIR" \
          -DCMAKE_C_FLAGS="-fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fPIC"
        cmake --build "$CS_SRC/build" -j"$(nproc)"
        cmake --install "$CS_SRC/build"

        # only64bit skips the no-Capstone 32-bit secondary build.
        ./autogen.sh
        ./configure --enable-only64bit
        make -j$(nproc)
        sudo make install

    - name: Run benchmarks
      uses: CodSpeedHQ/action@c145068895e045cc725ee76fcd2307624b65c3af  # v4.17.5
      with:
        mode: simulation
        run: uv run --no-sync pytest tests/prof/perf --codspeed --randomly-seed="$RANDOMLY_SEED" -k arm
        upload-url: ${{ secrets.CODSPEED_STAGING_UPLOAD_URL }}
        # https://github.com/CodSpeedHQ/codspeed/releases/tag/v4.16.1
        # runner-version: rev:ae00939db0524427812966c6e3ed6db49ca36bdc

  memory_benchmarks:
    if: false
    name: Memory benchmarks
    runs-on: codspeed-macro
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      with:
        persist-credentials: false

    - name: Install Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version-file: pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      with:
        enable-cache: false

    - name: Build msgspec and install profiling dependencies
      run: uv sync --group test-prof

    - name: Run benchmarks
      uses: CodSpeedHQ/action@c145068895e045cc725ee76fcd2307624b65c3af  # v4.17.5
      with:
        mode: memory
        run: uv run --no-sync pytest tests/prof/perf --randomly-seed="$RANDOMLY_SEED" --codspeed -k amd -m memory
